services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orencode
      POSTGRES_USER: orencode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orencode-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orencode -d orencode"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://orencode:${POSTGRES_PASSWORD:-orencode-local-only}@db:5432/orencode
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-federation@orencode.test}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      FSP_HEAD_NAME: ${FSP_HEAD_NAME:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes:
  postgres_data:
