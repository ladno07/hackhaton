server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  add_header Referrer-Policy "no-referrer" always;
  location /check-certificate/ {
    try_files $uri /index.html;
  }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /p/ {
    rewrite ^/p/([^/]+)/?$ /api/public/passports/$1/page break;
    proxy_pass http://backend:8000;
    proxy_intercept_errors on;
    error_page 404 /index.html;
  }
  location /verify/ {
    rewrite ^/verify/([^/]+)/?$ /api/public/protocols/$1/page break;
    proxy_pass http://backend:8000;
    proxy_intercept_errors on;
    error_page 404 /index.html;
  }
  location = /_public_passport_shell.html {
    internal;
    alias /usr/share/nginx/html/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
  location = /index.html {
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
